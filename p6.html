<!DOCTYPE html>
<html>
<head>
    <title>Image Map</title>
</head>

<body style="text-align:center;">

    <h2>Technology Image Map</h2>

    <img src="techstack.png"
         usemap="#tech"
         width="800"
         alt="Technology Stack">

    <map name="tech">

        <area shape="circle"
              coords="150,150,60"
              href="https://react.dev"
              alt="React">

        <area shape="circle"
              coords="400,150,60"
              href="https://developer.mozilla.org/en-US/docs/Web/HTML"
              alt="HTML">

        <area shape="circle"
              coords="650,150,60"
              href="https://developer.mozilla.org/en-US/docs/Web/CSS"
              alt="CSS">

        <area shape="circle"
              coords="150,500,60"
              href="https://nodejs.org"
              alt="Node.js">

        <area shape="circle"
              coords="400,500,60"
              href="https://www.python.org"
              alt="Python">

    </map>

</body>
</html>
